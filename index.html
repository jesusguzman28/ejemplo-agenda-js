<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda de Contactos</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <main class="contenedor">
    <h1>Agenda de Contactos</h1>

    <form id="form-contacto" class="tarjeta">
      <h2>Nuevo contacto</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej: Ana Torres" />

      <label for="telefono">Teléfono</label>
      <input type="text" id="telefono" placeholder="Ej: 987654321" />

      <label for="email">Correo (opcional)</label>
      <input type="email" id="email" placeholder="Ej: ana@correo.com" />

      <button type="submit">Agregar</button>
    </form>

    <section class="tarjeta">
      <h2>Contactos guardados</h2>
      <input type="search" id="buscador" placeholder="Buscar por nombre..." />
      <ul id="lista-contactos"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
